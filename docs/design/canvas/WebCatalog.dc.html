<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Web – Danh mục khoá học</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}
a{color:#C2321C}
.han{font-family:'Noto Serif SC',serif}
.btn{height:44px;padding:0 18px;border:0;border-radius:4px;font:700 15px 'Be Vietnam Pro',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.acc{background:#C2321C;color:#fff}.ink{background:#1C1D1F;color:#fff}.out{background:#fff;color:#1C1D1F;box-shadow:inset 0 0 0 1px #1C1D1F}
.field{height:44px;width:100%;padding:0 12px;border:1px solid #6A6F73;border-radius:4px;font:400 15px 'Be Vietnam Pro',sans-serif;background:#fff;color:#1C1D1F}
.mut{color:#6A6F73}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700}
.wrap{max-width:1340px;margin:0 auto;padding:0 24px}
.lay{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.filters{flex:1 1 240px;max-width:280px;display:flex;flex-direction:column;gap:8px}
.list{flex:999 1 640px;min-width:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:260px 1fr auto;gap:20px;padding:20px 0;border-bottom:1px solid #D1D7DC;text-decoration:none;color:#1C1D1F}
.thumb{aspect-ratio:16 / 9;border-radius:4px;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px;color:#fff}
.opt{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.opt input{width:18px;height:18px;accent-color:#1C1D1F;margin:0}
details summary{list-style:none;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #1C1D1F;background:#fff;font:700 14px 'Be Vietnam Pro',sans-serif;display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){.wrap{padding:0 16px}.row{grid-template-columns:120px 1fr}.row .price{grid-column:2}.filters{max-width:none}.hide-sm{display:none}}
</style>
</helmet>
<div style="width: 100%; background: #FFFFFF; color: #1C1D1F; font-family: 'Be Vietnam Pro', system-ui, sans-serif; padding-bottom: 72px">
  <header style="box-shadow: 0 2px 4px rgba(0,0,0,.08)">
    <div class="wrap" style="height: 72px; display: flex; align-items: center; gap: 20px">
      <a href="WebHome.dc.html" aria-label="Chinese Learner, trang chủ" style="display: flex; align-items: center; gap: 10px; color: #1C1D1F; text-decoration: none"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="L"><circle cx="32" cy="32" r="30"></circle></clipPath></defs><g clip-path="url(#L)"><rect width="64" height="64" fill="#C2321C"></rect><path d="M0 44 L13 37 L22 41 L33 34 L46 40 L64 33 V64 H0 Z" fill="#9E2715"></path><path d="M14 64 C 22 59, 34 57, 34 52 C 34 47.5, 27.5 46.5, 27.5 43 C 27.5 40, 31.4 38.5, 31.6 35.5 H33 C 33.2 38.5, 32.2 40.5, 32.2 43 C 32.2 45.5, 44 47.5, 44 52.5 C 44 57.5, 40 60, 44 64 Z" fill="#FFFFFF"></path><path d="M18 30 H46 A5.5 5.5 0 0 0 44.5 19.6 A8 8 0 0 0 29.5 16.5 A6.5 6.5 0 0 0 18 30 Z" fill="#FFFFFF"></path></g></svg><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.035em">Chinese Learner</span></a>
      <div style="flex: 1 1 auto; position: relative"><label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm khoá học</label><input id="q" class="field" value="hsk" style="border-radius: 24px; padding-left: 46px; background: #F7F9FA; border-color: #1C1D1F; height: 48px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 17px; top: 14px"><circle cx="11" cy="11" r="7" fill="none" stroke="#1C1D1F" stroke-width="2"></circle><path d="M16 16l5 5" stroke="#1C1D1F" stroke-width="2"></path></svg></div>
      <a href="WebMyCourses.dc.html" class="hide-sm" style="font-size: 14px; color: #1C1D1F; text-decoration: none">Khoá học của tôi</a>
      <a href="WebProfile.dc.html" aria-label="Tài khoản" style="width: 40px; height: 40px; border-radius: 20px; background: #1C1D1F; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; text-decoration: none">L</a>
    </div>
  </header>

  <div class="wrap" style="padding-top: 28px; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-size: 14px; font-weight: 700"><a href="WebHome.dc.html" style="text-decoration: none">Trang chủ</a> <span class="mut">›</span> Khoá học</p>
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">[n] kết quả cho “hsk”</h1>
    <div class="chips" role="group" aria-label="Chương trình">
      <button class="chip" style="background: #1C1D1F; color: #fff">Tất cả</button>
      <button class="chip">Easy Steps</button><button class="chip">YCT</button><button class="chip">HSK</button><button class="chip">Giao tiếp</button>
    </div>
    <div class="lay">
      <aside class="filters" aria-label="Bộ lọc">
        <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Bộ lọc</h2><button style="border: 0; background: none; font: 700 14px 'Be Vietnam Pro', sans-serif; color: #C2321C">Xoá lọc</button></div>
        <fieldset style="border: 0; border-top: 1px solid #D1D7DC; margin: 0; padding: 14px 0 6px">
          <legend style="font-size: 16px; font-weight: 700; padding: 0">Cấp độ</legend>
          <label class="opt"><input type="checkbox" checked="">HSK 1–2 · Mới bắt đầu</label>
          <label class="opt"><input type="checkbox">HSK 3–4 · Trung cấp</label>
          <label class="opt"><input type="checkbox">HSK 5–6 · Nâng cao</label>
        </fieldset>
        <fieldset style="border: 0; border-top: 1px solid #D1D7DC; margin: 0; padding: 14px 0 6px">
          <legend style="font-size: 16px; font-weight: 700; padding: 0">Giá</legend>
          <label class="opt"><input type="checkbox">Miễn phí</label>
          <label class="opt"><input type="checkbox">Trả phí</label>
          <label class="opt"><input type="checkbox" checked="">Có bài học thử</label>
        </fieldset>
        <fieldset style="border: 0; border-top: 1px solid #D1D7DC; margin: 0; padding: 14px 0 6px">
          <legend style="font-size: 16px; font-weight: 700; padding: 0">Thời lượng</legend>
          <label class="opt"><input type="checkbox">Dưới 3 giờ</label>
          <label class="opt"><input type="checkbox">3–10 giờ</label>
          <label class="opt"><input type="checkbox">Trên 10 giờ</label>
        </fieldset>
      </aside>

      <section class="list" aria-label="Kết quả">
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid #D1D7DC">
          <label for="sort" style="font-size: 14px; font-weight: 700">Sắp xếp</label>
          <select id="sort" class="field" style="width: 220px"><option>Phù hợp nhất</option><option>Mới nhất</option><option>Giá thấp đến cao</option></select>
        </div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
          <a href="WebCourse.dc.html" class="row">
            <div class="thumb" style="background: {{ r.color }}"><span class="han" style="font-size: 40px; line-height: 1">{{ r.han }}</span></div>
            <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <span style="font-size: 18px; font-weight: 700; line-height: 1.3">{{ r.title }}</span>
              <span style="font-size: 14px; line-height: 1.5">{{ r.desc }}</span>
              <span class="mut" style="font-size: 13px">GV [Tên giáo viên]</span>
              <sc-if value="{{ r.rated }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px"><b style="color: #B4690E">[4,5] ★</b> <span class="mut">· [nguồn đánh giá]</span></span></sc-if>
              <span class="mut" style="font-size: 13px">{{ r.meta }}</span>
              <span style="display: flex; gap: 6px; flex-wrap: wrap"><span class="tag" style="background: #E4ECF8; color: #173B78">Có học thử</span><sc-if value="{{ r.badge }}" hint-placeholder-val="{{ true }}"><span class="tag" style="background: #FCE8C3; color: #5A3A00">Nổi bật</span></sc-if></span>
            </div>
            <span class="price" style="font-size: 18px; font-weight: 800; white-space: nowrap">{{ r.price }}</span>
          </a>
        </sc-for>
        <nav aria-label="Trang" style="display: flex; justify-content: center; gap: 6px; padding-top: 24px">
          <button class="btn out" style="width: 44px; padding: 0" aria-label="Trang trước">‹</button>
          <button class="btn ink" style="width: 44px; padding: 0" aria-current="page">1</button>
          <button class="btn out" style="width: 44px; padding: 0">2</button>
          <button class="btn out" style="width: 44px; padding: 0" aria-label="Trang sau">›</button>
        </nav>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const P = '[GIÁ] ₫';
    return {
      rows: [
        { title: 'HSK 1: nền tảng giao tiếp và 150 từ vựng', desc: 'Phát âm chuẩn, ngữ pháp cốt lõi và luyện đề cho người bắt đầu từ số 0.', meta: '[n] bài · [n] giờ · Mới bắt đầu', han: '一', color: '#1F4FA0', price: P, rated: true, badge: true },
        { title: 'HSK 2: mở rộng 300 từ, câu ghép', desc: 'Câu so sánh, bổ ngữ kết quả, hội thoại đi chợ, hỏi đường.', meta: '[n] bài · [n] giờ · Mới bắt đầu', han: '二', color: '#1F4FA0', price: P, rated: false, badge: false },
        { title: 'HSK 3: luyện đề và nghe hiểu', desc: 'Đề mẫu có giải thích, kỹ năng nghe chép và đọc hiểu.', meta: '[n] bài · [n] giờ · Trung cấp', han: '三', color: '#173B78', price: P, rated: false, badge: false },
        { title: 'Ngữ pháp HSK 1–3 trong 20 bài', desc: 'Toàn bộ cấu trúc ngữ pháp cấp sơ cấp, mỗi bài một điểm.', meta: '[n] bài · [n] giờ · Mới bắt đầu', han: '法', color: '#173B78', price: 'Miễn phí', rated: false, badge: false }
      ]
    };
  }
}
</script>
</body>
</html>
