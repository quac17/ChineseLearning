name: CD - Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO || 'chinese-learner-repo' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'user-client/**'

  deploy-server:
    name: Build & Deploy Backend (chinese-learner-server)
    needs: detect-changes
    if: ${{ (needs.detect-changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch') && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA || format('github-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Server Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-server:${{ github.sha }}"
          LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-server:latest"
          docker build -t "$IMAGE" -t "$LATEST" ./server
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy Server to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-server:${{ github.sha }}"
          CORS_ORIGIN="${{ vars.CORS_ORIGIN || 'https://tiengtrung365vn.com,https://www.tiengtrung365vn.com' }}"
          APP_URL="${{ vars.APP_URL || 'https://tiengtrung365vn.com' }}"
          API_PUBLIC_URL="${{ vars.API_PUBLIC_URL || 'https://api.tiengtrung365vn.com/api' }}"
          COOKIE_SAME_SITE="${{ vars.COOKIE_SAME_SITE || 'lax' }}"
          GCS_BUCKET="${{ vars.GCS_BUCKET || format('{0}-chinese-learner-media', env.PROJECT_ID) }}"
          RUNTIME_SA="${{ vars.GCP_RUNTIME_SA || format('chinese-learner-server@{0}.iam.gserviceaccount.com', env.PROJECT_ID) }}"
          CLOUD_SQL="${{ vars.CLOUD_SQL_CONNECTION || format('{0}:{1}:chinese-learner-pg', env.PROJECT_ID, env.REGION) }}"
          PAYOS_ENABLED="${{ vars.FEATURE_PAYOS_ENABLED || 'false' }}"
          MAIL_ENABLED="${{ vars.FEATURE_MAIL_ENABLED || 'false' }}"

          SECRETS_ARG="JWT_SECRET=chinese-learner-jwt-secret:latest,DATABASE_URL=chinese-learner-database-url:latest"
          if [ "$PAYOS_ENABLED" = "true" ]; then
            SECRETS_ARG="${SECRETS_ARG},PAYOS_CLIENT_ID=chinese-learner-payos-client-id:latest,PAYOS_API_KEY=chinese-learner-payos-api-key:latest,PAYOS_CHECKSUM_KEY=chinese-learner-payos-checksum-key:latest"
          fi
          if [ "$MAIL_ENABLED" = "true" ]; then
            SECRETS_ARG="${SECRETS_ARG},SMTP_PASS=chinese-learner-smtp-pass:latest,REMINDER_CRON_SECRET=chinese-learner-reminder-cron-secret:latest"
          fi

          gcloud run deploy chinese-learner-server \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --memory 1Gi \
            --timeout 3600 \
            --add-cloudsql-instances "$CLOUD_SQL" \
            --set-env-vars "^@^NODE_ENV=production@FEATURE_PAYOS_ENABLED=${PAYOS_ENABLED}@FEATURE_MAIL_ENABLED=${MAIL_ENABLED}@JWT_EXPIRES_IN=7d@COOKIE_NAME=chinese_learner_token@COOKIE_SECURE=true@COOKIE_SAME_SITE=${COOKIE_SAME_SITE}@CORS_ORIGIN=${CORS_ORIGIN}@APP_URL=${APP_URL}@API_PUBLIC_URL=${API_PUBLIC_URL}@PAYMENT_GATEWAY=${{ vars.PAYMENT_GATEWAY || 'fake' }}@STORAGE_BACKEND=gcs@GCS_BUCKET=${GCS_BUCKET}@GCS_SIGNED_URL_TTL_MIN=15@GCS_UPLOAD_URL_TTL_MIN=30@MAX_VIDEO_SIZE_MB=2000@MAX_DOC_SIZE_MB=30@MAX_AUDIO_SIZE_MB=${{ vars.MAX_AUDIO_SIZE_MB || '10' }}@MAIL_TRANSPORT=${{ vars.MAIL_TRANSPORT || 'console' }}@MAIL_FROM=${{ vars.MAIL_FROM || 'Tiếng Trung 365 <no-reply@tiengtrung365vn.com>' }}@SMTP_HOST=${{ vars.SMTP_HOST || '' }}@SMTP_PORT=${{ vars.SMTP_PORT || '465' }}@SMTP_USER=${{ vars.SMTP_USER || '' }}@MAIL_DEV_OUTBOX=false@TRUST_PROXY=1" \
            --set-secrets "$SECRETS_ARG"

  deploy-client:
    name: Build & Deploy Frontend (chinese-learner-client)
    needs: detect-changes
    if: ${{ (needs.detect-changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch') && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA || format('github-deployer@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Client Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-client:${{ github.sha }}"
          LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-client:latest"
          API_URL="${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tiengtrung365vn.com/api' }}"
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${API_URL}" \
            --build-arg "NEXT_PUBLIC_SUPPORT_CONTACT=${{ vars.NEXT_PUBLIC_SUPPORT_CONTACT || '' }}" \
            --build-arg "NEXT_PUBLIC_REFUND_POLICY=${{ vars.NEXT_PUBLIC_REFUND_POLICY || '' }}" \
            --build-arg "NEXT_PUBLIC_FEATURE_PAYOS_ENABLED=${{ vars.FEATURE_PAYOS_ENABLED || 'false' }}" \
            --build-arg "NEXT_PUBLIC_FEATURE_MAIL_ENABLED=${{ vars.FEATURE_MAIL_ENABLED || 'false' }}" \
            -t "$IMAGE" -t "$LATEST" ./user-client
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy Client to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/chinese-learner-client:${{ github.sha }}"
          gcloud run deploy chinese-learner-client \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --allow-unauthenticated \
            --memory 512Mi
