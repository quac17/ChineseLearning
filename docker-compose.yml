services:
  postgres:
    image: postgres:16-alpine
    container_name: vankinh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vankinh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vankinh_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vankinh_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vankinh} -d ${POSTGRES_DB:-vankinh_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
