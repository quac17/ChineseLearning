services:
  postgres:
    image: postgres:16-alpine
    container_name: chinese-learner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chinese_learner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinese_learner_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chinese_learner_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chinese_learner} -d ${POSTGRES_DB:-chinese_learner_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
